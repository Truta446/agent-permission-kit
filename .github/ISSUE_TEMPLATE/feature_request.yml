name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case first, not the API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API (optional)
      render: ts
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the core dependency-free and fail-closed
