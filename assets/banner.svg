<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">agent-permission-kit</title>
  <desc id="desc">Give your AI agents permissions, not unlimited access. Each tool call is allowed, denied, or sent for human approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1022"/>
      <stop offset="1" stop-color="#131A3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#6D5BFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#6D5BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B7CFF"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: Inter, "Segoe UI", Ubuntu, "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Left: identity -->
  <g transform="translate(88 150)">
    <path d="M28 0 L56 10 V34 C56 52 44 64 28 70 C12 64 0 52 0 34 V10 Z" fill="url(#shield)"/>
    <path d="M16 35 L25 44 L41 26" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="88" y="276" class="sans" font-size="54" font-weight="800" fill="#FFFFFF" letter-spacing="-1">agent-permission-kit</text>
  <text x="88" y="330" class="sans" font-size="26" font-weight="500" fill="#C7CBE6">Give your AI agents permissions,</text>
  <text x="88" y="364" class="sans" font-size="26" font-weight="500" fill="#C7CBE6">not unlimited access.</text>

  <g class="sans" font-size="17" font-weight="600">
    <rect x="88" y="410" width="118" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="147" y="434" text-anchor="middle" fill="#E4E6F5">TypeScript</text>
    <rect x="218" y="410" width="104" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="270" y="434" text-anchor="middle" fill="#E4E6F5">0 deps</text>
    <rect x="334" y="410" width="82" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="375" y="434" text-anchor="middle" fill="#E4E6F5">MCP</text>
    <rect x="428" y="410" width="128" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="492" y="434" text-anchor="middle" fill="#E4E6F5">fail-closed</text>
  </g>

  <!-- Right: decision feed -->
  <g transform="translate(676 118)">
    <rect width="520" height="404" rx="18" fill="#0E1430" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <rect width="520" height="48" rx="18" fill="#FFFFFF" fill-opacity="0.04"/>
    <rect y="30" width="520" height="18" fill="#0E1430"/>
    <circle cx="26" cy="24" r="6" fill="#FF5F57"/>
    <circle cx="46" cy="24" r="6" fill="#FEBC2E"/>
    <circle cx="66" cy="24" r="6" fill="#28C840"/>
    <text x="260" y="29" text-anchor="middle" class="mono" font-size="14" fill="#8A90B8">guard.execute(toolCall, handler)</text>

    <!-- row 1 -->
    <g transform="translate(24 76)">
      <text y="22" class="mono" font-size="19" fill="#E4E6F5">database.read</text>
      <text y="46" class="mono" font-size="14" fill="#7C83AD">{ id: 123 }</text>
      <rect x="318" y="4" width="154" height="34" rx="8" fill="#22C55E" fill-opacity="0.16" stroke="#22C55E" stroke-opacity="0.55"/>
      <path d="M360 21 l5 5 l10 -11" fill="none" stroke="#4ADE80" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="384" y="27" class="sans" font-size="15" font-weight="700" fill="#4ADE80">ALLOW</text>
    </g>
    <line x1="24" x2="496" y1="152" y2="152" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <!-- row 2 -->
    <g transform="translate(24 166)">
      <text y="22" class="mono" font-size="19" fill="#E4E6F5">payments.refund</text>
      <text y="46" class="mono" font-size="14" fill="#7C83AD">{ amount: 200 }</text>
      <rect x="318" y="4" width="154" height="34" rx="8" fill="#F59E0B" fill-opacity="0.16" stroke="#F59E0B" stroke-opacity="0.55"/>
      <rect x="343" y="14" width="4" height="14" rx="1.5" fill="#FBBF24"/><rect x="351" y="14" width="4" height="14" rx="1.5" fill="#FBBF24"/>
      <text x="364" y="27" class="sans" font-size="15" font-weight="700" fill="#FBBF24">APPROVAL</text>
    </g>
    <line x1="24" x2="496" y1="242" y2="242" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <!-- row 3 -->
    <g transform="translate(24 256)">
      <text y="22" class="mono" font-size="19" fill="#E4E6F5">database.delete</text>
      <text y="46" class="mono" font-size="14" fill="#7C83AD">{ table: "users" }</text>
      <rect x="318" y="4" width="154" height="34" rx="8" fill="#EF4444" fill-opacity="0.16" stroke="#EF4444" stroke-opacity="0.55"/>
      <path d="M365 15 l11 11 M376 15 l-11 11" stroke="#F87171" stroke-width="2.6" stroke-linecap="round"/>
      <text x="385" y="27" class="sans" font-size="15" font-weight="700" fill="#F87171">DENY</text>
    </g>
    <line x1="24" x2="496" y1="332" y2="332" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <!-- row 4 -->
    <g transform="translate(24 346)">
      <text y="22" class="mono" font-size="19" fill="#E4E6F5">shell.exec</text>
      <text y="46" class="mono" font-size="14" fill="#7C83AD">no rule: default deny</text>
      <rect x="318" y="4" width="154" height="34" rx="8" fill="#EF4444" fill-opacity="0.16" stroke="#EF4444" stroke-opacity="0.55"/>
      <path d="M365 15 l11 11 M376 15 l-11 11" stroke="#F87171" stroke-width="2.6" stroke-linecap="round"/>
      <text x="385" y="27" class="sans" font-size="15" font-weight="700" fill="#F87171">DENY</text>
    </g>
  </g>
</svg>
